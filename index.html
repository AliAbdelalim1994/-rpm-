<head>
<title>Cairo Area RPM</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d6b6e"><meta name="description" content="RPM sales reporting for the area, stores and agents"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="RPM">
<style>
/* Layout: ops console. Sticky top bar, left sidebar grouped by job (overview, branches, plan, products, people, analysis, admin), content as tiles, tables, charts. */
:root{
  --bg:#eceff2; --surface:#ffffff; --ink:#111c26; --muted:#5b6b7a; --line:#d9e0e6; --track:#e3e8ed;
  --accent:#0d6b6e; --accent-soft:#dcefef; --c2:#6a55d4; --c3:#8896a4;
  --good:#1c7c46; --good-bg:#dff3e6; --warn:#8a5a06; --warn-bg:#fbefd2; --bad:#b42323; --bad-bg:#fbe1e1;
  --f-head:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --f-body:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e151b; --surface:#16202a; --ink:#e8eef3; --muted:#92a3b2; --line:#26333f; --track:#243240;
  --accent:#4fc3c7; --accent-soft:#12373a; --c2:#a99cff; --c3:#6f8192;
  --good:#52c585; --good-bg:#14301f; --warn:#e3b04b; --warn-bg:#382b0e; --bad:#f08080; --bad-bg:#3b1b1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e151b; --surface:#16202a; --ink:#e8eef3; --muted:#92a3b2; --line:#26333f; --track:#243240;
  --accent:#4fc3c7; --accent-soft:#12373a; --c2:#a99cff; --c3:#6f8192;
  --good:#52c585; --good-bg:#14301f; --warn:#e3b04b; --warn-bg:#382b0e; --bad:#f08080; --bad-bg:#3b1b1b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font-family:var(--f-head);font-weight:700;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.brand small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:12px;margin-left:8px}
.asof{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.asof b{color:var(--ink);font-weight:600}
.live{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.menu-btn{display:none;font:inherit;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-height:36px;cursor:pointer}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,tr[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{display:grid;grid-template-columns:208px minmax(0,1fr);gap:22px;align-items:start;padding-block:18px 40px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);max-height:calc(100vh - 80px);overflow:auto;display:flex;flex-direction:column;gap:14px}
.side h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding-inline:10px}
.side a{display:block;padding:7px 10px;border-radius:7px;color:var(--ink);text-decoration:none;font-weight:500}
.side a:hover{background:var(--surface)}
.side a[aria-current="page"]{background:var(--accent);color:var(--surface)}
main{display:flex;flex-direction:column;gap:18px;min-width:0}
h1,h2,h3{font-family:var(--f-head);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:24px} h2{font-size:16px} h3{font-size:14px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sec-h p{margin:0;color:var(--muted);font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.tile.hero{background:var(--accent-soft);border-color:var(--accent)}
.tile .v{font-family:var(--f-head);font-weight:700;font-size:30px;letter-spacing:-.02em;line-height:1.1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.tile.hero .v{font-size:36px;color:var(--accent)}
.tile .s{color:var(--muted);font-size:12px}
.tile .bar{margin-top:10px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
th.num{text-align:right}
th.grp{text-align:center;border-bottom:1px solid var(--line);color:var(--ink)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.link{cursor:pointer}
tr.link:hover td,tr.sel td{background:var(--bg)}
tr.area td{font-weight:600;background:var(--bg)}
td.name{font-weight:500;white-space:nowrap}
td.wrap,td.txt{white-space:normal;min-width:240px;font-size:13px}
.sticky1{position:sticky;left:0;background:var(--surface);z-index:1}
tr.area .sticky1,tr.link:hover .sticky1,tr.sel .sticky1{background:var(--bg)}
.bar{display:block;position:relative;height:8px;background:var(--track);border-radius:4px;min-width:90px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar b{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink);border-radius:1px}
.cellbar{display:flex;align-items:center;gap:10px}
.cellbar .bar{flex:1}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.good{background:var(--good-bg);color:var(--good)} .warn{background:var(--warn-bg);color:var(--warn)} .bad{background:var(--bad-bg);color:var(--bad)}
.chip.nb{background:var(--track);color:var(--muted)}
.plus{color:var(--good);font-weight:600} .minus{color:var(--bad);font-weight:600} .muted{color:var(--muted)}
td.heat{text-align:center;font-weight:600;font-variant-numeric:tabular-nums;border-left:2px solid var(--surface);border-bottom:2px solid var(--surface)}
.comm{font-weight:700;font-family:var(--f-head)}
.hbars{display:grid;gap:8px}
.hrow{display:grid;grid-template-columns:110px 1fr 130px;gap:10px;align-items:center}
.hrow .bar{height:14px;border-radius:3px} .hrow .bar i{border-radius:3px}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select,input[type=search],input[type=text],input[type=number],input[type=date],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px;max-width:100%}
td input[type=number]{width:92px;text-align:right;padding:6px 8px;min-height:34px}
td input[type=text]{width:100%;min-width:140px;padding:6px 8px;min-height:34px}
textarea{width:100%;min-height:150px;font-size:13px;line-height:1.5;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.btn,.seg button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--surface);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.head p{margin:4px 0 0;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.cards>div{border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.cards b{font-family:var(--f-head)}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px}
.day{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.day .d{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day .n{font-family:var(--f-head);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.pill-row{display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:12px;color:var(--muted)}
.banner{border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px}
.info{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;font-size:13px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;counter-reset:s}
.steps>div{border:1px solid var(--line);border-radius:8px;padding:12px;counter-increment:s}
.steps>div::before{content:counter(s);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--surface);font-weight:700;font-size:12px;margin-bottom:6px}
.lg{display:inline-flex;align-items:center;gap:6px;margin-right:14px;font-size:12px;color:var(--muted)}
.lg i{width:12px;height:3px;border-radius:2px;display:inline-block}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
svg.ch .gl{stroke:var(--line);stroke-width:1}
svg.ch .ln{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.field{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.field input,.field select{color:var(--ink)}
.formrow{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.ok{color:var(--good);font-weight:600} .miss{color:var(--bad);font-weight:600}
footer{font-size:12px;color:var(--muted);padding-bottom:8px}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:inline-block}
  .side{display:none;position:static;max-height:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
  .side.open{display:flex}
}
@media (max-width:560px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile{padding:12px} .tile .v{font-size:25px} .tile.hero .v{font-size:28px}
  .hrow{grid-template-columns:78px 1fr 92px}
  h1{font-size:21px}
  .brand small{display:none}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}

.cc{display:inline-flex;flex-direction:column;align-items:flex-end;gap:4px}

.cellbar{min-width:190px;gap:12px}
.cellbar .bar{min-width:70px}

.chip{padding:3px 10px}

/* employee page: no manager navigation */
body.solo .side{display:none}
body.solo .menu-btn{display:none}
body.solo .shell{grid-template-columns:minmax(0,940px);justify-content:center}
/* phones: tables become stacked cards, nothing scrolls sideways */

/* payout ladder (My plan) */
.lad{position:relative;height:12px;border-radius:6px;margin:38px 4px 30px;border:1px solid var(--line)}
.lad .tk{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
.lad .tl{position:absolute;top:17px;transform:translateX(-50%);font-size:11px;font-weight:500;color:var(--muted);white-space:nowrap}
.lad .you{position:absolute;top:-6px;width:3px;height:24px;margin-left:-1px;background:var(--ink);border-radius:2px;text-decoration:none}
.lad .you span{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:600;color:var(--ink)}
